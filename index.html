<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- No external network calls: everything below is served from this origin. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Health Dashboard</title>
  <meta name="description" content="Private, offline health dashboard. All data stays on this device.">
  <meta name="theme-color" content="#0b5fae">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme-init.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <h1 id="page-title">Health</h1>
    <span id="demo-badge" class="badge badge-demo" hidden>Demo data</span>
  </header>

  <main id="main" tabindex="-1" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/overview" data-route="overview"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg><span>Overview</span></a>
    <a href="#/labs" data-route="labs"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 2v2h1v5.6L4.4 19A2 2 0 0 0 6.1 22h11.8a2 2 0 0 0 1.7-3L14 9.6V4h1V2zm3 2v6.2l2.3 3.8H9.7L12 10.2z"/></svg><span>Labs</span></a>
    <a href="#/log" data-route="log"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m0 16H5V8h14zM7 10h5v5H7z"/></svg><span>Log</span></a>
    <a href="#/metrics" data-route="metrics"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Wearables</span></a>
    <a href="#/settings" data-route="settings"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7m7.4-2.5.1-1-.1-1 2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L14.9 3h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11l-.1 1 .1 1-2.1 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.5 1 2-3.5z"/></svg><span>Settings</span></a>
  </nav>

  <div id="lock" class="lock" hidden>
    <form id="lock-form" class="lock-card" autocomplete="off">
      <h2>Locked</h2>
      <label for="lock-pin">Enter PIN</label>
      <input id="lock-pin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="12" autocomplete="off" required>
      <p id="lock-error" class="error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Unlock</button>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
